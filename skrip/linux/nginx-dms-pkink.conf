# Sistem Arkib Digital (DMS) PKINK - contoh konfigurasi nginx + PHP-FPM (Linux)
#
#   sudo cp skrip/linux/nginx-dms-pkink.conf /etc/nginx/sites-available/dms-pkink
#   sudo ln -s /etc/nginx/sites-available/dms-pkink /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Tukar server_name, laluan sijil SSL dan soket PHP-FPM ikut pelayan.
# HTTPS disyorkan (notifikasi peranti di telefon & SESSION_SECURE_COOKIE memerlukannya).

server {
    listen 80;
    server_name dms.contoh.gov.my;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dms.contoh.gov.my;

    ssl_certificate     /etc/ssl/certs/dms-pkink.crt;
    ssl_certificate_key /etc/ssl/private/dms-pkink.key;

    # Folder public/ SAHAJA dihidangkan; fail imbasan disimpan di luar (storage/app/private)
    root /var/www/dms_pkink/public;
    index index.php;

    # Muat naik imbasan (had aplikasi 10MB setiap fail, beberapa fail sekali)
    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        # OCR + AI segerak (bila worker tidak berjalan) boleh mengambil masa hingga 300 s
        fastcgi_read_timeout 330;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
